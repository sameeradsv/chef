name: Deploy Chef

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -c "from app.main import app; assert app.title == 'Chef API'"

  build-frontend:
    needs: build-backend
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      # Set CHEF_API_URL in repo Actions variables (e.g. https://chef-api.onrender.com)
      NEXT_PUBLIC_API_URL: ${{ vars.CHEF_API_URL || 'https://chef-api.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build static site
        working-directory: frontend
        run: |
          npm ci
          npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  deploy-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (optional)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK not set — use Render Blueprint auto-deploy from render.yaml"
          fi
