# Connect this repo at https://dashboard.render.com → New → Blueprint
# Free PostgreSQL: data persists across deploys (expires after 90 days on free plan)
databases:
  - name: chef-db
    plan: free
    region: oregon

services:
  - type: web
    name: chef-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chef-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: CORS_ORIGINS
        value: https://sameeradsv.github.io,http://localhost:3000,http://127.0.0.1:3000
