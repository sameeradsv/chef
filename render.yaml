# Connect at https://dashboard.render.com → New → Blueprint
# DATABASE_URL must be set manually in the Render dashboard after deploy
# (use a free Neon PostgreSQL: https://neon.tech)
services:
  - type: web
    name: chef-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://sameeradsv.github.io,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      - key: CORTEX_AUTH_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
